<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Japan Drifts</title>
    <link rel="icon" href="../assets/images/JAPAN.png">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/account.css">
</head>
<body class="account-page">
    <site-navbar data-root="../"></site-navbar>
    <main class="account-main">
        <section class="account-card" aria-labelledby="account-title">
            <p class="account-eyebrow">JAPAN DRIFTS / MEMBER ACCESS</p>
            <h1 id="account-title">Your account</h1>
            <p class="account-intro">Sign in or create an account to manage your profile.</p>

            <div class="account-tabs" role="tablist" aria-label="Account access">
                <button class="account-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="login-panel" data-account-tab="login">Sign in</button>
                <button class="account-tab" type="button" role="tab" aria-selected="false" aria-controls="register-panel" data-account-tab="register">Create account</button>
            </div>

            <form class="account-form" id="login-panel" data-account-panel="login">
                <label class="account-field">
                    <span>Email address</span>
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label class="account-field">
                    <span>Password</span>
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button class="account-submit" type="submit">Sign in</button>
                <p class="account-feedback" data-login-feedback role="status" aria-live="polite"></p>
            </form>

            <form class="account-form" id="register-panel" data-account-panel="register" hidden>
                <label class="account-field">
                    <span>Full name</span>
                    <input type="text" name="name" autocomplete="name" maxlength="100" required>
                </label>
                <label class="account-field">
                    <span>Email address</span>
                    <input type="email" name="email" autocomplete="email" maxlength="254" required>
                </label>
                <label class="account-field">
                    <span>Address</span>
                    <input type="text" name="address" autocomplete="street-address" maxlength="200" required>
                </label>
                <label class="account-field">
                    <span>Password</span>
                    <input type="password" name="password" autocomplete="new-password" minlength="8" required>
                    <small>Use at least 8 characters.</small>
                </label>
                <label class="account-field">
                    <span>Confirm password</span>
                    <input type="password" name="confirm-password" autocomplete="new-password" minlength="8" required>
                </label>
                <button class="account-submit" type="submit">Create account</button>
                <p class="account-feedback" data-register-feedback role="status" aria-live="polite"></p>
            </form>

            <section class="account-profile" data-account-profile hidden aria-labelledby="profile-title">
                <div class="account-profile-heading">
                    <div>
                        <p class="account-eyebrow">MEMBER PROFILE</p>
                        <h2 id="profile-title">Welcome back</h2>
                    </div>
                    <button class="account-sign-out" type="button" data-account-signout>Sign out</button>
                </div>
                <form class="account-form" data-profile-form>
                    <label class="account-field">
                        <span>Full name</span>
                        <input type="text" name="name" autocomplete="name" maxlength="100" required>
                    </label>
                    <label class="account-field">
                        <span>Email address</span>
                        <input type="email" name="email" autocomplete="email" maxlength="254" required>
                    </label>
                    <label class="account-field">
                        <span>Address</span>
                        <input type="text" name="address" autocomplete="street-address" maxlength="200" required>
                    </label>
                    <button class="account-submit" type="submit">Save profile</button>
                    <p class="account-feedback" data-profile-feedback role="status" aria-live="polite"></p>
                </form>
            </section>
        </section>
    </main>
    <site-sidebar data-root="../"></site-sidebar>
    <site-footer data-root="../"></site-footer>
    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/account.js"></script>
</body>
</html>
